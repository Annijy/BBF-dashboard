name: Daily BBF update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-bbf-update
  cancel-in-progress: false  

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python fetch_news.py

      - name: Score news
        run: python score_news.py

      - name: Analyze top news with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze_top_with_gemini.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.csv data_scored.csv data_ai_analyzed.csv

          if ! git diff --cached --quiet; then
            git commit -m "Daily news update"
            git pull --rebase origin main
            git push origin main
          else
            echo "No data changes to commit"
          fi